name: deploy-infra
on:
  pull_request:
    paths: ['infra/**']
  push:
    branches: [main]
    paths: ['infra/**']

env:
  RG: rg-lbdemo

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Validate
        run: |
          az deployment group validate -g $RG -f infra/azuredeploy.json \
            -p sshPublicKey="${{ secrets.SSH_PUBLIC_KEY }}" alertEmail="${{ secrets.ALERT_EMAIL }}"
      - name: What-if
        run: |
          az deployment group what-if -g $RG -f infra/azuredeploy.json \
            -p sshPublicKey="${{ secrets.SSH_PUBLIC_KEY }}" alertEmail="${{ secrets.ALERT_EMAIL }}"

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy
        run: |
          az deployment group create -g $RG -f infra/azuredeploy.json \
            -p sshPublicKey="${{ secrets.SSH_PUBLIC_KEY }}" alertEmail="${{ secrets.ALERT_EMAIL }}"